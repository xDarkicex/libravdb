[package]
name = "libravdb"
version = "1.0.0"
edition = "2021"
description = "Rust SDK for LibraVDB"
authors = ["LibraVDB Team"]

[dependencies]
libc = "0.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[build-dependencies]
bindgen = "0.69.4"

[dev-dependencies]
chrono = "0.4.45"
